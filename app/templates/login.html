<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – IBS Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background:#f9fafb; margin:0; padding:2rem; }
    .card { max-width: 420px; margin: 2rem auto; background:#fff; padding:1.5rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    h1 { text-align:center; margin:0 0 1rem; }
    label { display:block; margin-top:0.5rem; }
    input { width:100%; padding:0.5rem; margin-top:0.2rem; border:1px solid #ccc; border-radius:4px; }
    button { width:100%; margin-top:1rem; padding:0.6rem; background:#2196F3; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .error { color:#E91E63; text-align:center; margin-top:0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>IBS Tracker Login</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
