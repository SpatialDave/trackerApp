<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IBS Tracker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 1rem; background: #f9fafb; color: #333; }
    h1 { text-align: center; margin-bottom: 0.5rem; }
    .back-btn {
      display: block; margin: 0.5rem auto 1rem auto; padding: 0.6rem 1.2rem;
      background: #2196F3; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    }
    .controls {
      max-width: 900px; margin: 0 auto 1rem auto; background: #fff; padding: 1rem;
      border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem;
    }
    label { font-size: 0.9rem; color: #555; }
    select, input[type="date"] {
      width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; background: #fff;
    }
    .actions { text-align: center; margin-top: 0.5rem; }
    .primary-btn {
      padding: 0.6rem 1rem; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    }
    .export-btn {
      padding: 0.6rem 1rem; background: #4CAF50; color: #fff; border: none; border-radius: 6px; cursor: pointer;
      margin-left: 0.5rem;
    }
    .chart-card {
      max-width: 1000px; margin: 0 auto; background: #fff; padding: 1rem; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>IBS Tracker Dashboard</h1>
  <button class="back-btn" onclick="window.location.href='/form'">← Back to Forms</button>

  <div class="controls">
    <div>
      <label>Dataset</label>
      <select id="dataset">
        <option value="bowel">Bowel Movements</option>
        <option value="feelings">Feelings</option>
        <option value="drinks">Drinks</option>
        <option value="meals">Meals</option>
      </select>
    </div>

    <div>
      <label>Metric</label>
      <select id="metric"></select>
    </div>

    <div>
      <label>Start date</label>
      <input type="date" id="startDate" />
    </div>

    <div>
      <label>End date</label>
      <input type="date" id="endDate" />
    </div>

    <div>
      <label>Hour interval</label>
      <select id="hourInterval">
        <option value="">None (raw data)</option>
        <option value="1">1 hour</option>
        <option value="2">2 hours</option>
        <option value="3">3 hours</option>
        <option value="6">6 hours</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="primary-btn" onclick="updateChart()">Update chart</button>
    <button class="export-btn" onclick="window.location.href='/export/csv'">Export CSV</button>
  </div>

  <div class="chart-card" style="margin-top: 1rem;">
    <canvas id="dynamicChart"></canvas>
  </div>

  <script>
    // Dataset -> metric options mapping (align with server-side DATASET_METRICS)
    const METRICS = {
      bowel: [
        { value: "bristol_scale", label: "Bristol scale" },
        { value: "urgency", label: "Urgency" },
        { value: "pain", label: "Discomfort" }
      ],
      feelings: [
        { value: "stress", label: "Stress" },
        { value: "anxiety", label: "Anxiety" },
        { value: "sleep_quality", label: "Sleep quality" }
      ],
      drinks: [
        { value: "volume_ml", label: "Volume (ml)" },
        { value: "caffeine", label: "Caffeine" },
        { value: "alcohol", label: "Alcohol" }
      ],
      meals: [
        { value: "count", label: "Meals per day (count)" }
      ]
    };

    function populateMetrics() {
      const ds = document.getElementById("dataset").value;
      const metricSel = document.getElementById("metric");
      metricSel.innerHTML = "";
      METRICS[ds].forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.value;
        opt.textContent = m.label;
        metricSel.appendChild(opt);
      });
    }

    let chartRef = null;

    async function updateChart() {
      const ds = document.getElementById("dataset").value;
      const metric = document.getElementById("metric").value;
      const start = document.getElementById("startDate").value || "";
      const end = document.getElementById("endDate").value || "";
      const interval = document.getElementById("hourInterval").value || "";

      const params = new URLSearchParams({ dataset: ds, metric });
      if (start) params.append("start_date", start);
      if (end) params.append("end_date", end);
      if (interval) params.append("hour_interval", interval);

      const res = await fetch(`/data?${params.toString()}`);
      if (!res.ok) {
        alert("Failed to load data. Please check filters.");
        return;
      }
      const data = await res.json();

      const labels = data.map(d => d.timestamp.length === 10
        ? d.timestamp
        : d.timestamp // for hour buckets, we return labels like "05:00-05:59"
      );
      const values = data.map(d => d.value);

      if (chartRef) chartRef.destroy();

      chartRef = new Chart(document.getElementById("dynamicChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `${ds} – ${metric}${interval ? ` (every ${interval}h)` : ""}`,
            data: values,
            borderColor: "#2196F3",
            backgroundColor: "rgba(33,150,243,0.15)",
            fill: true,
            tension: 0.3,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { display: true } }
        }
      });
    }

    document.getElementById("dataset").addEventListener("change", () => {
      populateMetrics();
      updateChart();
    });

    populateMetrics();
    updateChart();
  </script>
</body>
</html>
