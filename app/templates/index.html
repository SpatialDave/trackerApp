<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IBS Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f9fafb;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .button-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .btn {
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      color: #fff;
    }
    .meal-btn { background: #4CAF50; }
    .drink-btn { background: #2196F3; }
    .bm-btn { background: #FF9800; }
    .feeling-btn { background: #9C27B0; }
    .chart-btn { background: #607D8B; }

    .form-container {
      display: none;
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label { display: block; margin-top: 0.5rem; }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.2rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="checkbox"] {
      width: auto;
      margin-right: 0.5rem;
    }
    input[type="range"] {
      width: 100%;
    }
    button[type="submit"] {
      margin-top: 1rem;
      background: #333;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .message {
      display: none;
      text-align: center;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      background: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>IBS Tracker</h1>

  <!-- Success message -->
  <div id="message" class="message">Entry logged successfully!</div>

  <!-- Button bar -->
  <div class="button-bar">
    <button class="btn meal-btn" onclick="toggleForm('mealForm')">Log Meal</button>
    <button class="btn drink-btn" onclick="toggleForm('drinkForm')">Log Drink</button>
    <button class="btn bm-btn" onclick="toggleForm('bmForm')">Log Bowel Movement</button>
    <button class="btn feeling-btn" onclick="toggleForm('feelingForm')">Log Feelings</button>
    <button class="btn chart-btn" onclick="window.location.href='/dashboard'">View Charts</button>
  </div>

  <!-- Meal Form -->
  <div id="mealForm" class="form-container">
    <form method="post" action="/meals/form" onsubmit="showMessage()">
      <h2>Meal</h2>
      <label>Foods:</label>
      <input type="text" name="foods" required>
      <label>Notes:</label>
      <textarea name="notes"></textarea>
      <button type="submit">Save Meal</button>
    </form>
  </div>

  <!-- Drink Form -->
  <div id="drinkForm" class="form-container">
    <form method="post" action="/drinks/form" onsubmit="showMessage()">
      <h2>Drink</h2>
      <label>Type:</label>
      <select name="type" id="drinkType" onchange="toggleDrinkOptions()" required>
        <option value="Water" selected>Water</option>
        <option value="Coffee">Coffee</option>
        <option value="Tea">Tea</option>
        <option value="Cider">Cider</option>
        <option value="Guiness">Guiness</option>
        <option value="Cocktail">Cocktail</option>
      </select>

      <label>Volume (ml):</label>
      <input type="number" name="volume_ml" required>

      <!-- Decaf checkbox -->
      <div id="decafOption" style="display:none;">
        <label><input type="checkbox" name="decaf" value="1"> Decaf</label>
      </div>

      <!-- Alcohol checkbox -->
      <div id="alcoholOption" style="display:none;">
        <label><input type="checkbox" name="alcohol" value="1"> Contains Alcohol</label>
      </div>

      <button type="submit">Save Drink</button>
    </form>
  </div>

  <!-- Bowel Movement Form -->
  <div id="bmForm" class="form-container">
    <form method="post" action="/bowel-movements/form" onsubmit="showMessage()">
      <h2>Bowel Movement</h2>
      <label>Bristol Scale (1–7):</label>
      <input type="range" name="bristol_scale" min="1" max="7" value="4" oninput="this.nextElementSibling.value = this.value">
      <output>4</output>

      <label>Urgency (0–10):</label>
      <input type="range" name="urgency" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
      <output>5</output>

      <label>Discomfort (0–10):</label>
      <input type="range" name="pain" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
      <output>5</output>

      <label>Notes:</label>
      <textarea name="notes"></textarea>
      <button type="submit">Save Bowel Movement</button>
    </form>
  </div>

  <!-- Feelings Form -->
  <div id="feelingForm" class="form-container">
    <form method="post" action="/feelings/form" onsubmit="showMessage()">
      <h2>Feelings</h2>
      <label>Stress (0–10):</label>
      <input type="range" name="stress" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
      <output>5</output>

      <label>Anxiety (0–10):</label>
      <input type="range" name="anxiety" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
      <output>5</output>

      <label>Sleep Quality (0–10):</label>
      <input type="range" name="sleep_quality" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
      <output>5</output>

      <label>Notes:</label>
      <textarea name="notes"></textarea>
      <button type="submit">Save Feelings</button>
    </form>
  </div>

  <!-- JS -->
  <script>
    function toggleForm(id) {
      document.querySelectorAll('.form-container').forEach(f => f.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }

    function showMessage() {
      const msg = document.getElementById('message');
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }

    function toggleDrinkOptions() {
      const type = document.getElementById('drinkType').value;
      document.getElementById('decafOption').style.display = (type === "Coffee" || type === "Tea") ? 'block' : 'none';
      document.getElementById('alcoholOption').style.display = (["Cider","Guiness","Cocktail"].includes(type)) ? 'block' : 'none';
    }
  </script>
</body>
</html>
